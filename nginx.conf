# Static sidecar (production.yml). Traefik routes /static for the site
# hostname here; everything else goes to gunicorn.
server {
    listen 80;
    server_name _;

    # Block .env file probing (scanners/bots); close the connection.
    location ~* \.env {
        return 444;
    }

    # collectstatic output (admin, nested_admin, DRF). Plain filenames, so
    # keep the cache short enough that a Django upgrade shows up.
    location /static/ {
        alias /data/static/;
        expires 1d;
        add_header Cache-Control "public";
    }
}
